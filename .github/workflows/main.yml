name: generate snake

on:
  # regenerate every 6 hours so the grid stays fresh
  schedule:
    - cron: "0 */6 * * *"

  # run manually from the Actions tab
  workflow_dispatch:

  # run on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Builds the snake from the contribution graph.
      # Neon palette matches the pixel-city banner: magenta snake, cyan "food" cells on navy.
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        # SNAKE_TOKEN = your personal access token (classic, scopes: read:user + repo).
        # The default Actions token only sees PUBLIC activity, so private/org commits go missing without it.
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-retro.svg?color_snake=#ff2e97&color_dots=#141a33,#0b4a6f,#1282a2,#00b8d9,#00f0ff&color_dot_border=#0b0f1f

      # Publishes dist/ to the `output` branch:
      # https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
